plugins {
    // 26.2 官方模板用的是新插件 ID net.fabricmc.fabric-loom（旧的 'fabric-loom' 是
    // 需要 mappings 的旧路径，在无混淆版本上会报 "Configuration 'mappings' has no dependencies"）。
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+mc${minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'AliyunPublic'; url = 'https://maven.aliyun.com/repository/public' }
    maven { name = 'AliyunCentral'; url = 'https://maven.aliyun.com/repository/central' }
    maven { name = 'TencentMirror'; url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 26.1 起 Minecraft 不再混淆（Fabric 官方 Wiki：混淆止于 1.21.11）。
    // 官方 26.2 模板（fabric-example-mod 26.2 分支）里【没有】mappings 那行，
    // 依赖也从 modImplementation 换成 implementation —— 因为没有 remap 这回事了。
    // 之前用 modImplementation 会走 remap 路径并要求 mappings 配置非空：
    //   保留 mappings 行 → "Failed to find official mojang mappings for 26.2"
    //   删掉 mappings 行   → "Configuration 'mappings' has no dependencies"
    // 只有按官方模板用 implementation 才不碰 remap。
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API：只用客户端生命周期事件入口。
    // 不引入它时要自己写 Mixin 去 hook 客户端初始化，成本更高且更脆；
    // 而 Fabric API 是所有 Fabric 整合包的标准依赖，不存在额外分发负担。
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
