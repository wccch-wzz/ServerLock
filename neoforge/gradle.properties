org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.daemon=false

# —— 网络容错（沙箱环境必需）——
# maven.neoforged.net 走 CDN，部分节点在 TLS 握手阶段直接断连，Gradle 会抛
# "Remote host terminated the handshake"。默认对这类失败不重试，导致构建随机挂掉。
# 通过加大超时 + 提高重试次数，让 Gradle 在失败后自动换连接重试。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=15
systemProp.org.gradle.internal.repository.initial.backoff=300

# Minecraft / NeoForge
minecraft_version=1.21.1
neoforge_version=21.1.233
moddev_version=2.0.147
java_version=21

# Mod metadata
mod_version=1.0.0
maven_group=com.serverlock
archives_base_name=serverlock-neoforge
